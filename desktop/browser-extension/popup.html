<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icons/32.png" alt=""><h1>כספת סיסמאות</h1></header>
  <p id="site" class="muted"></p>
  <label class="switch-row" id="auto-row" hidden>
    <span><b>מילוי אוטומטי בטעינת דף</b><small>ממלא רק כשהכספת פתוחה ויש חשבון אחד בדיוק לאתר. כמה חשבונות – תוצג בחירה. את "התחבר" לוחצים בעצמך.</small></span>
    <input type="checkbox" id="auto" role="switch">
  </label>
  <div id="list"></div>
  <p id="status" class="muted"></p>
  <button id="open" class="tonal" hidden>פתח את התוכנה</button>
  <button id="open-tab" class="filled">פתח את הכספת בלשונית</button>
  <script src="popup.js"></script>
</body>
</html>
