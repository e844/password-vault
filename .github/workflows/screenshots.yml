name: Android UI test + screenshots

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/screenshots.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build screenshot APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleScreenshot
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: aosp_atd
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/scripts/screenshots.sh android/app/build/outputs/apk/screenshot/app-screenshot.apk screenshots-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: screenshots-out/
      - name: Publish screenshots (release "android-screenshots")
        if: ${{ !cancelled() || always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls screenshots-out/*.png >/dev/null 2>&1 || exit 0
          gh release view android-screenshots --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android-screenshots --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "צילומי מסך – אנדרואיד (נוצרים אוטומטית)" --notes "צילומי מסך מבדיקת הממשק על אמולטור. לא להורדה."
          gh release upload android-screenshots screenshots-out/*.png --repo "$GITHUB_REPOSITORY" --clobber
